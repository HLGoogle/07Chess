<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五子对弈单元</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #22272e; color: #adbac7; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }

  .nav-bar { width: 100%; max-width: 900px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .back-btn { text-decoration: none; color: #58a6ff; font-size: 13px; }

  .status-panel { width: 100%; max-width: 900px; background: #2d333b; border-radius: 8px; padding: 12px 18px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .seats { display: flex; gap: 12px; align-items: center; }
  .seat-tag { background: #1c2128; border: 1px solid #444c56; padding: 6px 12px; border-radius: 6px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .dot.b { background: #000; border: 1px solid #fff; }
  .dot.w { background: #fff; }

  button { background: #347d39; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  button:hover { opacity: 0.9; }
  .btn-warn { background: #b08800; }
  .btn-danger { background: #cb2431; }
  .btn-neutral { background: #444c56; }

  .timer-tag { font-size: 14px; font-weight: bold; color: #f69d50; padding: 4px 8px; background: #1c2128; border-radius: 4px; }

  .main-stage { width: 100%; max-width: 900px; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  
  #board-box { background: #d6a84c; padding: 15px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,0.4); display: flex; flex-direction: column; align-items: center; }
  canvas { cursor: pointer; }
  .ctrl-bar { margin-top: 12px; display: flex; gap: 10px; }

  .chat-mount { width: 320px; height: 520px; background: #2d333b; border-radius: 8px; overflow: hidden; border: 1px solid #444c56; }
  .chat-frame { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>

<div class="nav-bar">
  <a href="../index.html" class="back-btn">← 返回大厅容器</a>
  <div id="role-display" style="font-size:13px; color:#58a6ff;">观战模式</div>
</div>

<div class="status-panel">
  <div class="seats">
    <div class="seat-tag">
      <span class="dot b"></span>
      <span id="black-name">黑方: 虚位以待</span>
      <button id="btn-take-b" onclick="seat(1)">入座</button>
    </div>
    <div class="seat-tag">
      <span class="dot w"></span>
      <span id="white-name">白方: 虚位以待</span>
      <button id="btn-take-w" onclick="seat(2)">入座</button>
    </div>
    <button id="btn-leave" class="btn-neutral" style="display:none;" onclick="leave()">离席</button>
  </div>

  <div style="display:flex; align-items:center; gap:12px;">
    <div id="turn-txt" style="font-size:13px; font-weight:bold;">等待入座</div>
    <div id="timer-txt" class="timer-tag" style="display:none;">30 秒</div>
  </div>
</div>

<div class="main-stage">
  <div id="board-box">
    <canvas id="chess" width="480" height="480"></canvas>
    <div class="ctrl-bar">
      <button class="btn-warn" id="btn-draw" onclick="drawReq()" disabled>求和</button>
      <button class="btn-danger" id="btn-resign" onclick="resignReq()" disabled>认输</button>
      <button class="btn-neutral" id="btn-restart" onclick="restartReq()" disabled>重新开局</button>
    </div>
  </div>

  <!-- 挂载公共聊天组件，并指定当前房间号为 01Five -->
  <div class="chat-mount">
    <iframe class="chat-frame" src="../shared/chat.html?room=01Five"></iframe>
  </div>
</div>

<script>
  let ws, myId = null, myRole = 0;
  let boardState = Array(15).fill(null).map(() => Array(15).fill(0));
  let currentTurn = 1, winner = 0, lastMove = null, turnDeadline = 0;
  let blackPlayer = null, whitePlayer = null;

  const canvas = document.getElementById("chess");
  const ctx = canvas.getContext("2d");
  const CELL = 30, PAD = 30;

  function connect() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const host = "07chess.hl273573221.workers.dev";
    ws = new WebSocket(`${proto}//${host}?room=01Five`);

    ws.onopen = () => {
      const savedName = localStorage.getItem("global_player_name") || "弈客";
      ws.send(JSON.stringify({ type: "join", name: savedName }));
    };

    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (data.type === "init") {
        myId = data.playerId;
        applySync(data);
      } else if (data.type === "sync") {
        applySync(data);
      } else if (data.type === "draw_offer") {
        if (myRole !== 0 && myRole !== data.fromRole) {
          const agree = confirm(`对方 [${data.fromName}] 申请求和，是否同意握手言和？`);
          ws.send(JSON.stringify({ type: "respond_draw", accept: agree }));
        }
      }
    };
  }

  function applySync(data) {
    boardState = data.board;
    currentTurn = data.turn;
    winner = data.winner;
    lastMove = data.lastMove;
    blackPlayer = data.blackPlayer;
    whitePlayer = data.whitePlayer;
    turnDeadline = data.turnDeadline;

    if (blackPlayer && blackPlayer.id === myId) myRole = 1;
    else if (whitePlayer && whitePlayer.id === myId) myRole = 2;
    else myRole = 0;

    updateUI();
    drawBoard();
  }

  function updateUI() {
    document.getElementById("black-name").innerText = blackPlayer ? `黑方: ${blackPlayer.name}` : "黑方: 虚位以待";
    document.getElementById("white-name").innerText = whitePlayer ? `白方: ${whitePlayer.name}` : "白方: 虚位以待";

    document.getElementById("btn-take-b").style.display = (!blackPlayer && myRole === 0) ? "inline-block" : "none";
    document.getElementById("btn-take-w").style.display = (!whitePlayer && myRole === 0) ? "inline-block" : "none";
    document.getElementById("btn-leave").style.display = (myRole !== 0) ? "inline-block" : "none";

    const roles = ["观战模式", "执黑 (先手)", "执白 (后手)"];
    document.getElementById("role-display").innerText = roles[myRole];

    const ready = blackPlayer && whitePlayer;
    document.getElementById("btn-draw").disabled = !ready || myRole === 0 || winner !== 0;
    document.getElementById("btn-resign").disabled = !ready || myRole === 0 || winner !== 0;
    document.getElementById("btn-restart").disabled = !ready || myRole === 0;

    const turnEl = document.getElementById("turn-txt");
    const timerEl = document.getElementById("timer-txt");

    if (!ready) {
      turnEl.innerText = "等待入座...";
      timerEl.style.display = "none";
    } else if (winner !== 0) {
      turnEl.innerText = winner === 1 ? "黑方胜出！" : (winner === 2 ? "白方胜出！" : "握手言和！");
      timerEl.style.display = "none";
    } else {
      turnEl.innerText = currentTurn === 1 ? "轮到 黑方 下子" : "轮到 白方 下子";
      timerEl.style.display = "block";
    }
  }

  setInterval(() => {
    if (turnDeadline > 0 && winner === 0 && blackPlayer && whitePlayer) {
      const remaining = Math.max(0, Math.ceil((turnDeadline - Date.now()) / 1000));
      const t = document.getElementById("timer-txt");
      t.innerText = `${remaining} 秒`;
      t.style.color = remaining <= 5 ? "#cb2431" : "#f69d50";

      if (remaining === 0 && myRole === currentTurn) {
        ws.send(JSON.stringify({ type: "check_timeout" }));
      }
    }
  }, 500);

  function drawBoard() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "#4a3c28";
    ctx.lineWidth = 1;

    for (let i = 0; i < 15; i++) {
      ctx.beginPath();
      ctx.moveTo(PAD, PAD + i * CELL);
      ctx.lineTo(PAD + 14 * CELL, PAD + i * CELL);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(PAD + i * CELL, PAD);
      ctx.lineTo(PAD + i * CELL, PAD + 14 * CELL);
      ctx.stroke();
    }

    const stars = [[3, 3], [11, 3], [7, 7], [3, 11], [11, 11]];
    for (const [sx, sy] of stars) {
      ctx.beginPath();
      ctx.arc(PAD + sx * CELL, PAD + sy * CELL, 3, 0, 2 * Math.PI);
      ctx.fillStyle = "#4a3c28";
      ctx.fill();
    }

    for (let y = 0; y < 15; y++) {
      for (let x = 0; x < 15; x++) {
        if (boardState[y][x] !== 0) drawPiece(x, y, boardState[y][x]);
      }
    }

    if (lastMove) {
      ctx.fillStyle = "#cb2431";
      ctx.beginPath();
      ctx.arc(PAD + lastMove.x * CELL, PAD + lastMove.y * CELL, 4, 0, 2 * Math.PI);
      ctx.fill();
    }
  }

  function drawPiece(x, y, color) {
    const cx = PAD + x * CELL, cy = PAD + y * CELL;
    ctx.beginPath();
    ctx.arc(cx, cy, 13, 0, 2 * Math.PI);
    const grad = ctx.createRadialGradient(cx - 3, cy - 3, 1, cx, cy, 13);
    if (color === 1) {
      grad.addColorStop(0, "#57606f"); grad.addColorStop(1, "#000000");
    } else {
      grad.addColorStop(0, "#ffffff"); grad.addColorStop(1, "#dcdde1");
    }
    ctx.fillStyle = grad;
    ctx.fill();
  }

  canvas.addEventListener("click", (e) => {
    if (winner !== 0 || myRole !== currentTurn || !blackPlayer || !whitePlayer) return;
    const rect = canvas.getBoundingClientRect();
    const x = Math.round((e.clientX - rect.left - PAD) / CELL);
    const y = Math.round((e.clientY - rect.top - PAD) / CELL);

    if (x >= 0 && x < 15 && y >= 0 && y < 15 && boardState[y][x] === 0) {
      ws.send(JSON.stringify({ type: "drop", x, y }));
    }
  });

  function seat(r) { ws.send(JSON.stringify({ type: "take_seat", role: r })); }
  function leave() { ws.send(JSON.stringify({ type: "leave_seat" })); }
  function drawReq() { ws.send(JSON.stringify({ type: "propose_draw" })); }
  function resignReq() { if (confirm("确认认输？")) ws.send(JSON.stringify({ type: "resign" })); }
  function restartReq() { if (confirm("重新开局？")) ws.send(JSON.stringify({ type: "restart" })); }

  connect();
</script>

</body>
</html>
