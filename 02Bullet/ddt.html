<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>网页版弹弹堂 (DDT Mini)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a2e;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }
    #gameContainer {
      position: relative;
      border: 3px solid #e94560;
      border-radius: 8px;
      overflow: hidden;
    }
    canvas { background: #0f3460; display: block; }
    .panel {
      width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 15px;
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 6px;
      margin-top: 10px;
    }
    .hud { font-size: 15px; font-weight: bold; }
    .controls-tip { font-size: 12px; color: #8ecae6; }
  </style>
</head>
<body>

  <h2>💥 弹弹堂 网页轻量版</h2>
  
  <div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
  </div>

  <div class="panel">
    <div class="hud" id="turnInfo">当前回合: 玩家 1 (红)</div>
    <div class="hud" id="windInfo">风向: 0 (无风)</div>
    <div class="hud" id="angleInfo">角度: 45°</div>
    <div class="hud" id="powerInfo">蓄力: 0%</div>
  </div>

  <div class="panel controls-tip">
    操作指引：【A / D】移动 | 【W / S】调整发射角度 | 【长按 空格键】蓄力，松开开火
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI 元素
    const turnInfo = document.getElementById('turnInfo');
    const windInfo = document.getElementById('windInfo');
    const angleInfo = document.getElementById('angleInfo');
    const powerInfo = document.getElementById('powerInfo');

    // 地形高度贴图 (像素级数组)
    const terrain = new Uint16Array(canvas.width);
    function generateTerrain() {
      let h = 350;
      for (let x = 0; x < canvas.width; x++) {
        h += (Math.sin(x * 0.01) * 1.5) + (Math.sin(x * 0.03) * 0.8);
        terrain[x] = Math.min(Math.max(h, 200), 450);
      }
    }

    // 玩家配置
    const players = [
      { id: 1, name: '玩家 1', color: '#e63946', x: 100, y: 0, hp: 100, angle: 45, dir: 1 },
      { id: 2, name: '玩家 2', color: '#457b9d', x: 700, y: 0, hp: 100, angle: 45, dir: -1 }
    ];

    let turn = 0; // 0 为玩家1，1 为玩家2
    let wind = 0; // 风力 (-5 到 5)
    let isCharging = false;
    let chargePower = 0;
    let bullet = null;

    function resetWind() {
      wind = (Math.random() * 6 - 3).toFixed(1);
      windInfo.innerText = `风力: ${Math.abs(wind)} (${wind >= 0 ? '顺风 ➔' : '逆风 ⬅'})`;
    }

    // 初始化位置与地形
    generateTerrain();
    resetWind();

    function updatePlayerY() {
      players.forEach(p => {
        let groundY = terrain[Math.floor(p.x)] || 350;
        p.y = groundY - 12;
      });
    }

    // 弹坑爆炸（地形破坏）
    function explode(cx, cy, radius) {
      for (let x = Math.max(0, Math.floor(cx - radius)); x < Math.min(canvas.width, Math.ceil(cx + radius)); x++) {
        let dx = x - cx;
        let dy = Math.sqrt(radius * radius - dx * dx);
        let craterBottom = cy + dy;
        if (terrain[x] < craterBottom) {
          terrain[x] = Math.min(canvas.height, Math.max(terrain[x], craterBottom));
        }
      }

      // 计算伤害
      players.forEach(p => {
        let dist = Math.hypot(p.x - cx, p.y - cy);
        if (dist < radius + 15) {
          let damage = Math.floor((1 - dist / (radius + 15)) * 60);
          p.hp = Math.max(0, p.hp - damage);
        }
      });
    }

    // 键盘监听
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space' && !bullet && !isCharging) {
        isCharging = true;
        chargePower = 0;
      }
    });

    window.addEventListener('keyup', e => {
      keys[e.code] = false;
      if (e.code === 'Space' && isCharging) {
        fireBullet();
        isCharging = false;
      }
    });

    function fireBullet() {
      const cur = players[turn];
      const rad = (cur.angle * Math.PI) / 180;
      const speed = (chargePower / 100) * 22;

      bullet = {
        x: cur.x,
        y: cur.y - 10,
        vx: Math.cos(rad) * speed * cur.dir,
        vy: -Math.sin(rad) * speed,
        radius: 4
      };
      chargePower = 0;
    }

    function switchTurn() {
      turn = 1 - turn;
      resetWind();
      turnInfo.innerText = `当前回合: ${players[turn].name}`;
      turnInfo.style.color = players[turn].color;
    }

    function gameLoop() {
      const cur = players[turn];

      // 处理移动与瞄准角度
      if (!bullet) {
        if (keys['KeyA'] && cur.x > 30) { cur.x -= 2; cur.dir = -1; }
        if (keys['KeyD'] && cur.x < canvas.width - 30) { cur.x += 2; cur.dir = 1; }
        if (keys['KeyW'] && cur.angle < 89) cur.angle++;
        if (keys['KeyS'] && cur.angle > 1) cur.angle--;

        angleInfo.innerText = `角度: ${cur.angle}°`;

        if (isCharging) {
          chargePower = Math.min(100, chargePower + 1.2);
          powerInfo.innerText = `蓄力: ${Math.floor(chargePower)}%`;
        }
      }

      // 更新炮弹物理轨迹
      if (bullet) {
        bullet.vx += wind * 0.015; // 风力加速度
        bullet.vy += 0.35;        // 重力加速度
        bullet.x += bullet.vx;
        bullet.y += bullet.vy;

        let bx = Math.floor(bullet.x);
        let by = Math.floor(bullet.y);

        // 碰触地形、越界或命中
        if (bx < 0 || bx >= canvas.width || by >= canvas.height || (by >= terrain[bx])) {
          explode(bullet.x, bullet.y, 25);
          bullet = null;
          powerInfo.innerText = '蓄力: 0%';
          switchTurn();
        }
      }

      updatePlayerY();

      // 渲染画布
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 绘制破坏后的地形
      ctx.fillStyle = '#2b9348';
      ctx.beginPath();
      ctx.moveTo(0, canvas.height);
      for (let x = 0; x < canvas.width; x++) {
        ctx.lineTo(x, terrain[x]);
      }
      ctx.lineTo(canvas.width, canvas.height);
      ctx.closePath();
      ctx.fill();

      // 绘制角色
      players.forEach(p => {
        // 血条
        ctx.fillStyle = '#333';
        ctx.fillRect(p.x - 20, p.y - 30, 40, 6);
        ctx.fillStyle = '#06d6a0';
        ctx.fillRect(p.x - 20, p.y - 30, (p.hp / 100) * 40, 6);

        // 身体
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 12, 0, Math.PI * 2);
        ctx.fill();

        // 炮管
        const rad = (p.angle * Math.PI) / 180;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y - 5);
        ctx.lineTo(p.x + Math.cos(rad) * 20 * p.dir, (p.y - 5) - Math.sin(rad) * 20);
        ctx.stroke();
      });

      // 绘制炮弹
      if (bullet) {
        ctx.fillStyle = '#ffd166';
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
