<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对战平台容器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #161b22;
    color: #c9d1d9;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 16px;
  }
  
  .container {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  header {
    border-bottom: 1px solid #30363d;
    padding-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 22px; color: #f0f6fc; }
  .hub-desc { font-size: 13px; color: #8b949e; }

  /* 纯净卡片展示区，不再受聊天 iframe 干扰 */
  .grid-area {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
    width: 100%;
  }
  
  .entry-card {
    background: #21262d;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 20px;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: 0.2s;
    min-height: 160px;
  }
  .entry-card:hover {
    border-color: #58a6ff;
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .entry-card.disabled {
    opacity: 0.45;
    pointer-events: none;
  }
  .entry-title {
    font-size: 16px;
    font-weight: bold;
    color: #f0f6fc;
    margin-bottom: 8px;
  }
  .entry-desc {
    font-size: 13px;
    color: #8b949e;
    line-height: 1.5;
    margin-bottom: 16px;
  }
  .entry-action {
    align-self: flex-start;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 4px;
    background: #238636;
    color: #fff;
  }
  .entry-card.disabled .entry-action {
    background: #30363d;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>应用集成大厅</h1>
      <div class="hub-desc">模块化棋类与桌面游戏容器底座</div>
    </div>
  </header>

  <!-- 仅保留游戏网格，彻底拔除导致套娃的 iframe -->
  <div class="grid-area" id="game-grid"></div>
</div>

<script>
  var GAME_REGISTRY = [
    {
      id: "01Five",
      name: "01 号组件 (五子对弈)",
      desc: "标准 15×15 网格决策对抗模块，集成席位仲裁与时钟控制器。",
      path: "./01Five/gomoku.html",
      active: true
    },
    {
      id: "02Bow",
      name: "02 号组件 (神箭争锋)",
      desc: "风向影响与抛物线弹道物理计算模块，支持拉弓蓄力与定角射击对抗。",
      path: "./02Bow/bow.html",
      active: true
    }
  ];

  var grid = document.getElementById("game-grid");

  for (var i = 0; i < GAME_REGISTRY.length; i++) {
    var item = GAME_REGISTRY[i];
    var card = document.createElement("a");
    card.className = "entry-card" + (item.active ? "" : " disabled");
    if (item.active) {
      card.href = item.path;
    }

    var actionText = item.active ? "启动对局" : "准备中";

    card.innerHTML = 
      '<div>' +
        '<div class="entry-title">' + item.name + '</div>' +
        '<div class="entry-desc">' + item.desc + '</div>' +
      '</div>' +
      '<div class="entry-action">' + actionText + '</div>';

    grid.appendChild(card);
  }
</script>

</body>
</html>
