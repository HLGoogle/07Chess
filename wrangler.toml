# ==============================================================================
# 07Chess 部署配置文件 (Cloudflare Wrangler 专用)
# 作用：定义 Worker 服务名称、启动入口文件以及绑定 Durable Object 有状态内存实例
# ==============================================================================

# 1. 部署到 Cloudflare 上的服务名称
name = "07chess"

# 2. 后端执行入口
main = "index.js"

# 3. 兼容运行环境版本基准
compatibility_date = "2024-02-25"

# ------------------------------------------------------------------------------
# 4. Durable Objects (有状态内存对象) 绑定
# 作用：实时落子仲裁、30秒倒计时、以及房间广播均常驻在对应的内存实例中运行
# ------------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "CHESS_ROOM"
class_name = "ChessRoom"

# ------------------------------------------------------------------------------
# 5. 存储迁移记录 (Migrations)
# 作用：首次启用 Durable Objects 必须带有此迁移声明以分配底层 SQLite 存储
# ------------------------------------------------------------------------------
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChessRoom"]
