# ==============================================================================
# 07Chess 部署配置文件 (Cloudflare Wrangler 专用)
# 作用：告诉 Cloudflare 本项目的名称、启动入口文件、以及需要调用的云端能力
# ==============================================================================

# 1. 部署到 Cloudflare 上的服务名称（即 Worker 的名字）
# 部署后默认会得到一个对应域名前缀：例如 07chess-server.你的账号名.workers.dev
name = "07chess-server"

# 2. 后端代码的主入口文件
# 告诉云端服务器从哪一个脚本文件开始执行
main = "index.js"

# 3. 运行环境兼容日期
# 锁定 Cloudflare Workers 的运行时底层版本，确保未来 API 更新不会破坏现有代码
compatibility_date = "2024-02-25"

# ------------------------------------------------------------------------------
# 4. Durable Objects (常驻持久化内存对象) 绑定
# 作用：棋盘联机、30秒倒计时和实时打字聊天必须依赖这个常驻内存空间
# ------------------------------------------------------------------------------
[[durable_objects.bindings]]
# 代码里调用的变量名，对应 index.js 中的 env.CHESS_ROOM
name = "CHESS_ROOM"
# 对应的类名，必须和 index.js 里 export class ChessRoom 的名字一模一样
class_name = "ChessRoom"

# ------------------------------------------------------------------------------
# 5. 存储迁移记录 (Migrations)
# 作用：首次启用 Durable Objects 时，告知云端为该类分配专用的状态存储空间
# ------------------------------------------------------------------------------
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChessRoom"]
